packages:
  - "packages/*"
  # 一次性验证用的私有应用，不属于对外发布的包
  - "poc/*"
  # 开发期工作台等内部应用
  - "apps/*"

# 供应链防护：只安装发布满 7 天（10080 分钟）的版本。
# 需要豁免某个包时，必须先经用户批准，再写入 minimumReleaseAgeExclude。
minimumReleaseAge: 10080

# 发布年龄豁免。每一项都需要用户批准，并写明范围与理由。
minimumReleaseAgeExclude:
  # 用户于 2026-11-22 批准：UI SDK 首发仅十天，所有可用版本都不满 7 天。
  # 适用范围：poc/ 下的应用，以及 packages/ui 中 Base UI 没有的组件（见 ADR-001）。
  # 依赖它的地方必须精确锁定版本。
  - "@ui-sdk/*"

# 依赖的安装脚本默认不执行，这里逐个表态。
allowBuilds:
  # @tailwindcss/cli 的依赖，仅 --watch 模式使用；其安装脚本只在缺少预编译二进制时
  # 才从源码编译。本仓库不使用 watch 模式，因此不允许执行。
  "@parcel/watcher": false
  # Storybook 的依赖。安装脚本只用于校验或补装平台二进制；二进制已通过可选依赖
  # 安装到位（storybook build 实测可用），因此不允许执行。
  esbuild: false

# 依赖版本的唯一来源。各包的 package.json 只写 catalog:，版本在这里统一维护。
# strict：pnpm add 会把新依赖写入这里，并拒绝与这里不一致的版本。
catalogMode: strict

catalog:
  "@axe-core/playwright": "^4.14.0"
  "@base-ui/react": "^1.9.0"
  "@phosphor-icons/react": ^2.1.10
  "@playwright/test": "^1.65.1"
  "@storybook/addon-a11y": "^10.6.7"
  "@storybook/react-vite": "^10.6.7"
  "@tailwindcss/cli": "^4.3.5"
  "@tailwindcss/postcss": ^4.3.5
  "@tanstack/react-table": ^9.3.1
  "@testing-library/react": "^16.3.3"
  "@testing-library/user-event": "^14.6.10"
  "@types/node": "^26.6.6"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@ui-sdk/core": "0.1.0-beta.13"
  "@ui-sdk/react": "0.1.0-beta.13"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  geist: ^1.9.2
  jsdom: "^31.0.1"
  lucide-react: ^1.73.0
  motion: ^14.14.0
