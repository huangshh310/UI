# 质量门禁：每次推送到 main 或发起 PR 时运行。
# 只做检查，不包含 npm 发布和任何部署步骤。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：只需要读取代码
permissions:
  contents: read

# 同一分支有新提交时取消旧的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm 版本取自根 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
