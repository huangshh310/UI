# 质量门禁：每次推送到 main 或发起 PR 时运行。
# 只做检查，不包含 npm 发布和任何部署步骤。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：只需要读取代码
permissions:
  contents: read

# 同一分支有新提交时取消旧的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm 版本取自根 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # 消费方验证：把包打成 tarball，装进一个独立项目，在真实浏览器里检查
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter="./packages/*"
      - run: pnpm test:consumer

  # 展示站：在真实浏览器里检查目录、详情页、主题切换与可访问性
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter="./packages/*"
      - run: pnpm --filter @matt-ui/docs exec playwright install --with-deps chromium
      - run: pnpm --filter @matt-ui/docs e2e
